name: Bump filtro financeiro
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-filtro-financeiro.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versão do script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('financeiro-resumo-mensal.js?v=20260827-1','financeiro-resumo-mensal.js?v=20260827-2')
          p.write_text(s,encoding='utf-8')
          PY
          node --check financeiro-resumo-mensal.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza cache do filtro financeiro"
          git push
