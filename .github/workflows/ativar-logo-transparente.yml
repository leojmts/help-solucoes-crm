name: Ativar logo transparente
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ativar-logo-transparente.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar referências da logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="icon" type="image/png" href="help-logo.png?v=20260826">','<link rel="icon" type="image/svg+xml" href="help-logo-transparent.svg?v=20260826-1">')
          s=s.replace('<link rel="apple-touch-icon" href="help-logo.png?v=20260826">','<link rel="apple-touch-icon" href="help-logo-transparent.svg?v=20260826-1">')
          s=s.replace('<div class="brand-icon"><img src="help-logo.png" alt="Logo da Help Soluções Tecnológicas"></div>','<div class="brand-icon"><img src="help-logo-transparent.svg?v=20260826-1" alt="Logo da Help Soluções Tecnológicas"></div>')
          s=s.replace('<div class="login-v2-logo"><img src="help-logo.png" alt="Help Soluções Tecnológicas"></div>','<div class="login-v2-logo"><img src="help-logo-transparent.svg?v=20260826-1" alt="Help Soluções Tecnológicas"></div>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Usa logo transparente no CRM"
          git push
