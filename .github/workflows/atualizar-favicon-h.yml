name: Atualizar favicon H
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-favicon-h.yml'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar favicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="icon" type="image/png" href="help-logo.png?v=20260826-2">', '<link rel="icon" type="image/svg+xml" href="help-favicon-h.svg?v=20260827-1">\n  <link rel="shortcut icon" type="image/svg+xml" href="help-favicon-h.svg?v=20260827-1">')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'help-favicon-h.svg?v=20260827-1' index.html
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Usa H como favicon do CRM"
          git push
