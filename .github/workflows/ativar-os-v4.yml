name: Ativar documento OS v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ativar-os-v4.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar gerador da OS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='  <script src="os-documento-v3.js?v=20260826-1"></script>\n'
          new='  <script src="os-documento-v4.js?v=20260826-2"></script>\n'
          if old in s:
              s=s.replace(old,new)
          elif 'os-documento-v4.js' not in s:
              s=s.replace('</body>',new+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          node --check os-documento-v4.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Carrega documento OS v4 com colunas corrigidas"
          git push
