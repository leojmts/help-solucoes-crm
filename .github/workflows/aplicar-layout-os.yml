name: Aplicar layout comercial da OS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplicar-layout-os.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar layout
        run: |
          python - <<'PY'
          from pathlib import Path
          arquivo = Path('crm-correcoes.js')
          texto = arquivo.read_text(encoding='utf-8')
          texto = texto.replace("select('id,nome,unidade,telefone,email')", "select('id,nome,unidade,documento,telefone,email')")
          inicio = texto.index('imprimirOS = function () {')
          fim = texto.index('compartilharOSWhatsApp = function ()', inicio)
          novo = Path('scripts/os-layout-imprimir.js.txt').read_text(encoding='utf-8')
          arquivo.write_text(texto[:inicio] + novo + texto[fim:], encoding='utf-8')
          PY

      - name: Validar
        run: node --check crm-correcoes.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm-correcoes.js
          if ! git diff --cached --quiet; then
            git commit -m "Refaz layout impresso da ordem de serviço"
            git push
          fi
