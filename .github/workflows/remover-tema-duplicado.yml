name: Remover tema duplicado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remover-tema-duplicado.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover controle antigo de tema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gerenciamento-contas.js')
          s=p.read_text(encoding='utf-8')
          inicio='/* Tema Dark / Light e correções visuais globais. */'
          fim='/* OS: discriminação visual e documental de Serviços e Peças. */'
          if inicio in s and fim in s:
              a=s.index(inicio)
              b=s.index(fim, a)
              s=s[:a]+fim+s[b+len(fim):]
          p.write_text(s,encoding='utf-8')
          PY
          node --check gerenciamento-contas.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gerenciamento-contas.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove botao duplicado de tema"
          git push
