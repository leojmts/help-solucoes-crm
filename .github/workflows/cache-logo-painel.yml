name: Atualizar cache da logo do painel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-logo-painel.yml'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versão
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('help-logo-painel.svg?v=20260827-1','help-logo-painel.svg?v=20260827-2')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'help-logo-painel.svg?v=20260827-2' index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza cache da logo do painel"
          git push
