name: Corrigir resumo financeiro mensal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-resumo-financeiro-mes.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir totais do Financeiro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('financeiro-avancado.js')
          s = p.read_text(encoding='utf-8')
          novo = r'''function finRenderResumo(){
 const agora=new Date(),mesAtual=`${agora.getFullYear()}-${String(agora.getMonth()+1).padStart(2,'0')}`,hoje=finHoje();
 const pend=financeiroRegistros.filter(x=>x.status==='Pendente');
 const pendMes=pend.filter(x=>String(x.vencimento||'').slice(0,7)===mesAtual);
 const receber=pendMes.filter(x=>x.tipo==='Receber').reduce((s,x)=>s+finSaldo(x),0);
 const pagar=pendMes.filter(x=>x.tipo==='Pagar').reduce((s,x)=>s+finSaldo(x),0);
 const atras=pend.filter(x=>x.vencimento<hoje).reduce((s,x)=>s+finSaldo(x),0);
 const mov=finPagamentos.filter(x=>String(x.pago_em||'').slice(0,7)===mesAtual).reduce((s,x)=>s+Number(x.valor),0);
 const el=document.getElementById('financeiroResumo');
 if(el)el.innerHTML=[['arrow-down-circle','A receber',receber,'receber'],['alert-triangle','Em atraso',atras,'atraso'],['arrow-up-circle','A pagar',pagar,'pagar'],['circle-check-big','Movimentado',mov,'pago']].map(([i,t,v,c])=>`<article class="${c}"><i data-lucide="${i}"></i><span>${t}</span><strong>${osMoeda(v)}</strong></article>`).join('');
 if(window.lucide)lucide.createIcons()
}'''
          s2, n = re.subn(r'function finRenderResumo\(\)\{.*?\}\n\nrenderizarTabelaFinanceiro=', novo+'\n\nrenderizarTabelaFinanceiro=', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Não foi possível localizar finRenderResumo')
          p.write_text(s2, encoding='utf-8')

          p = Path('dashboard-financeiro.js')
          s = p.read_text(encoding='utf-8')
          antigo = "      let aReceber = 0, aPagar = 0, recebido = 0, pago = 0;\n      const pendentes = [];"
          novo2 = "      let aReceber = 0, aPagar = 0, recebido = 0, pago = 0;\n      const agora = new Date();\n      const mesAtual = `${agora.getFullYear()}-${String(agora.getMonth()+1).padStart(2,'0')}`;\n      const pendentes = [];"
          if antigo not in s:
              raise SystemExit('Não foi possível localizar bloco dos pins financeiros')
          s = s.replace(antigo, novo2, 1)
          antigo = "        if (l.tipo === 'Receber') aReceber += restante;\n        if (l.tipo === 'Pagar') aPagar += restante;"
          novo2 = "        const venceNoMesAtual = String(l.vencimento || '').slice(0,7) === mesAtual;\n        if (venceNoMesAtual && l.tipo === 'Receber') aReceber += restante;\n        if (venceNoMesAtual && l.tipo === 'Pagar') aPagar += restante;"
          if antigo not in s:
              raise SystemExit('Não foi possível localizar soma dos pins financeiros')
          s = s.replace(antigo, novo2, 1)
          s = s.replace('Valores ainda não recebidos.', 'Pendências com vencimento neste mês.', 1)
          s = s.replace('Contas ainda não pagas.', 'Pendências com vencimento neste mês.', 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check financeiro-avancado.js
          node --check dashboard-financeiro.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add financeiro-avancado.js dashboard-financeiro.js
          git commit -m "Filtra resumos financeiros pelo mês atual"
          git push
