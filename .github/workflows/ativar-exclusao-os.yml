name: Ativar exclusao de OS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ativar-exclusao-os.yml'
permissions:
  contents: write
jobs:
  ativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carregar exclusao de OS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='  <script src="os-exclusao.js?v=20260826-1"></script>\n'
          if 'os-exclusao.js' not in s:
              s=s.replace('</body>', tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          node --check os-exclusao.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Carrega exclusao segura de OS"
          git push
