name: Corrigir logo visivel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-logo-visivel.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar logo PNG original
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="icon" type="image/svg+xml" href="help-logo-transparent.svg?v=20260826-1">','<link rel="icon" type="image/png" href="help-logo.png?v=20260826-2">')
          s=s.replace('<link rel="apple-touch-icon" href="help-logo-transparent.svg?v=20260826-1">','<link rel="apple-touch-icon" href="help-logo.png?v=20260826-2">')
          s=s.replace('src="help-logo-transparent.svg?v=20260826-1"','src="help-logo.png?v=20260826-2"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -n "help-logo" index.html | head -n 10
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restaura logo original sem fundo do container"
          git push
